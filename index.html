<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年間カレンダー</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script>
      var trackingId = window.GTM_ID || window.GA_TRACKING_ID;
      if (trackingId) {
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + trackingId;
        document.head.appendChild(script);

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', trackingId);
      }
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
</head>
<body>
    <header>
        <div class="header-title-container">
            <h1 id="calendar-title">年間カレンダー</h1>
            <div id="year-info" class="year-info"></div>
        </div>
        <div class="year-selector">
            <div class="year-select-group">
                <div class="select-item">
                    <label for="country" id="country-label">国:</label>
                    <select id="country">
                        <option value="JP">🇯🇵 日本</option>
                        <option value="US">🇺🇸 アメリカ</option>
                        <option value="GB">🇬🇧 イギリス</option>
                    </select>
                </div>
                <div class="select-item">
                    <label for="year" id="year-label">年を選択:</label>
                    <select id="year"></select>
                </div>
            </div>
            <div class="year-btn-group">
                <button id="today-year-btn" class="today-year-btn" type="button">今年</button>
                <button id="lang-toggle" class="lang-toggle" type="button" aria-label="言語切り替え" title="Englishに切り替え">English</button>
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="テーマ切り替え" title="テーマ切り替え">☀️</button>
            </div>
        </div>
    </header>
    <main id="calendar-container"></main>
    <footer>
        <p id="holiday-note" class="holiday-note" style="display: none;"></p>
        <p>&copy; 2025-2026 c1t0d0s0</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
