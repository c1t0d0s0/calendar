name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Google Analytics / Google Tag Manager
        env:
          GTM_ID: ${{ vars.GTM_ID || secrets.GTM_ID }}
        run: |
          node -e '
            const fs = require("fs");
            const gtmId = process.env.GTM_ID;
            if (gtmId && gtmId.trim()) {
              const trimmedId = gtmId.trim();
              let html = fs.readFileSync("index.html", "utf8");
              html = html.replace(
                "var trackingId = window.GTM_ID || window.GA_TRACKING_ID;",
                "var trackingId = " + JSON.stringify(trimmedId) + ";"
              );
              const isGtm = /^GTM-/i.test(trimmedId);
              if (isGtm) {
                // Google Tag Manager (noscript) をbody直後に埋め込む
                const noscript =
                  "<!-- Google Tag Manager (noscript) -->\n" +
                  "    <noscript><iframe src=\"https://www.googletagmanager.com/ns.html?id=" + encodeURIComponent(trimmedId) + "\"\n" +
                  "    height=\"0\" width=\"0\" style=\"display:none;visibility:hidden\"></iframe></noscript>\n" +
                  "    <!-- End Google Tag Manager (noscript) -->";
                html = html.replace(/<body([^>]*)>/, (m) => m + "\n    " + noscript);
              }
              fs.writeFileSync("index.html", html, "utf8");
              fs.writeFileSync("config.js", "window.GTM_ID = " + JSON.stringify(trimmedId) + ";\n", "utf8");
              console.log("Successfully embedded " + (isGtm ? "Google Tag Manager" : "Google Analytics") + " tag: " + trimmedId);
            } else {
              fs.writeFileSync("config.js", "// No GTM_ID configured\n", "utf8");
              console.log("GTM_ID is not set. Skipped embedding.");
            }
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
